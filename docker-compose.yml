services:
  # ── Backend (Express API) ──────────────────────────────────────
  backend:
    build: ./backend
    container_name: cognisense-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TRUST_PROXY=1
    ports:
      - "3001:3001"      # Exposed for direct API access / debugging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend (React SPA served via nginx) ──────────────────────
  frontend:
    build: ./frontend
    container_name: cognisense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"        # Access the app at http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
