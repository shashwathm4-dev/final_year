server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files, fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy all /api calls to the backend container
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Increase timeout for VLM verify-rep calls (Gemini can be slow)
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Allow large body for /api/verify-rep (camera frames up to 5MB)
        client_max_body_size 6m;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve the service worker without caching
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
